# 数据库连接配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/software_engineering_forum?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# 连接池配置 (HikariCP)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=SoftwareEngineeringHikariCP
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# MyBatis Plus配置
mybatis.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# JWT配置
jwt.secret=${JWT_SECRET:software-engineering-dev-secret-key-for-local-development-2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# 应用配置
server.port=${SERVER_PORT:8080}
spring.application.name=software-engineering-forum

# Spark 离线分析触发配置（默认禁用，仅在服务器部署时通过环境变量启用）
# SPARK_ENABLED=true 时 /admin/statistics/trigger-spark 接口可用
spark.enabled=${SPARK_ENABLED:false}
spark.submit-path=${SPARK_SUBMIT_PATH:/opt/spark/bin/spark-submit}
spark.jar-path=${SPARK_JAR_PATH:/opt/forum-stats.jar}
spark.jdbc-url=${SPARK_JDBC_URL:jdbc:mysql://127.0.0.1:3306/software_engineering_forum?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spark.db-user=${SPARK_DB_USER:}
spark.db-pass=${SPARK_DB_PASS:}
